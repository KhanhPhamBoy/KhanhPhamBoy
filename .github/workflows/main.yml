# 🐍 Generate Snake - GitHub Contributions Animation
# --------------------------------------------------
# This workflow builds a "snake" animation from your GitHub contributions graph
# and pushes the generated SVG/GIF to a separate branch named `output`.

name: 🐍 Generate Snake

on:
  # 🕒 Run automatically on the 1st of every month at midnight
  schedule:
    - cron: "0 0 * * *"


  # 🔘 Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

  # 🚀 Run also whenever the main branch is updated
  push:
    branches:
      - main

permissions:
  contents: write   # Needed to push the generated files to the output branch

jobs:
  build:
    name: 🧩 Build and Deploy Snake
    runs-on: ubuntu-latest

    steps:
      # 📥 Step 1: Checkout the repository
      - name: 🌀 Checkout repository
        uses: actions/checkout@v4

      # 🐍 Step 2: Generate the snake animation files
      - name: 🐍 Generate contribution snake
        id: snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
          args: --year 2024
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
      # 🧾 Step 3: Check status (for debugging)
      - name: ✅ Verify build output
        run: ls -alh dist

      # 🚀 Step 4: Deploy the generated files to the `output` branch
      - name: 🚀 Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "🐍 Update snake animation"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
